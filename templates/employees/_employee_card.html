<div style="border: 1px solid #ccc; padding: 10px; margin: 10px;">
    <h3>{{ employee.last_name }} {{ employee.first_name }}</h3>
    <p><strong>Навыки:</strong>
        {% for emp_skill in employee.employeeskill_set.all %}
            {{ emp_skill.skill.name }} ({{ emp_skill.level }})
            {% if not forloop.last %}, {% endif %}
        {% empty %}
            Нет навыков
        {% endfor %}
    </p>
    <a href="{% url 'employee_detail' employee.pk %}">Подробнее...</a>
</div>
